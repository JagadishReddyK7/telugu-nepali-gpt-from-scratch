# =============================================================================
# Model H — Telugu.  Phase 3 reasoning-finetune configuration.
#
# Starts from Model H's OWN pretrained checkpoint. The architecture is not
# repeated here: common/finetune.py reads the `model` block out of `init_from`
# so the finetune can never disagree with the weights it loads, and copies it
# into every finetune checkpoint. The Telugu tokenizer and its 16,000-entry
# vocabulary are fixed; the answer prefix is ordinary text.
#
# Model L (nepali/configs/finetune.yaml) is a separate run on separate data.
# =============================================================================

name: model_h_telugu_reasoning
language: telugu
init_from: checkpoints/telugu/best.pt

# ------------------------------------------------------------------- data
data:
  # Generated by `python -m telugu.reasoning.generate` (seed 1337).
  train: telugu/reasoning/dataset/train.jsonl
  validation: telugu/reasoning/dataset/validation.jsonl
  test: telugu/reasoning/dataset/test.jsonl
  answer_prefix: "జవాబు:"

# --------------------------------------------------------------- training
train:
  # Examples are packed ~14 per 512-token row (see common/finetune.py), so one
  # row already holds a dozen examples; 16 rows x 512 = 8,192 tokens/step.
  batch_size: 16
  grad_accum: 1
  epochs: 8                      # ~2.3k rows/epoch -> ~145 steps/epoch

  # One-tenth of the pretraining peak. The pretrained weights sit in a good
  # basin; a 6e-4 step would leave it. Cosine to 1e-5 over the whole run.
  learning_rate: 1.0e-4
  min_learning_rate: 1.0e-5
  warmup_steps: 50
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  dropout: 0.1

  # 1.0 = plain LM loss over the packed stream (prompt and answer alike);
  # 0.0 = answer-only supervision. See the module docstring for the choice.
  prompt_loss_weight: 1.0

  dtype: float16                 # T4: fp16 + GradScaler
  seed: 1337

# ------------------------------------------------------------- evaluation
eval:
  eval_interval_steps: 50
  eval_batches: 20               # val rows scored for loss
  val_accuracy_examples: 400     # val examples decoded for exact match
  checkpoint_interval_steps: 50
  log_interval_steps: 10

# ------------------------------------------------------------------ paths
paths:
  tokenizer: telugu/tokenizer/telugu_sp_16000.model
  out_dir: checkpoints/telugu_reasoning
  log_file: report/phase3/logs/telugu_finetune.jsonl
  # Phase 1 binaries: used only by the post-finetune LM check (did the
  # finetune hurt general language modelling?) and the attention toolkit.
  train_bin: data/telugu/tokenized/train.bin
  val_bin: data/telugu/tokenized/validation.bin
  test_bin: data/telugu/tokenized/test.bin
